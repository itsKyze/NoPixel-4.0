<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="shortcut icon" type="image/ico" href="/src/assets/favicon.ico" />
    <link rel="stylesheet" href="https://assets.nopixel.net/web/fonts/fontawesome/stylesheet.css" />
    <title>NoPixel Boilerplate</title>
    
    <script>
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.includes('ResizeObserver') || e.message.includes('ResizeObserver loop limit exceeded'))) {
          e.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script type="module" src="/src/App.tsx"></script>
</body>
</html>
